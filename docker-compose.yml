version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - "5173:80"
    restart: always
    environment:
      - VITE_API_URL=/api
    networks:
      - api-network
  localtunnel:
    image: node:20-alpine
    restart: always
    command: npx --yes localtunnel --port 80 --local-host frontend_app --subdomain calcc
    networks:
      - api-network

networks:
  api-network:
    name: api-network
    driver: bridge
    external: true